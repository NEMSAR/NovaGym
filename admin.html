<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consola Central | NEMS Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>if(sessionStorage.getItem('nems_admin_token') !== 'autorizado_2026') window.location.href = 'index.html';</script>
    <style>
        body { background-color: #121214; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
        .glass-card { background: #1f1f23; border: 1px solid #27272a; border-radius: 2rem; position: relative; z-index: 10; }
        .input-dark { background: #121214; border: 1px solid #27272a; color: white; transition: all 0.3s; }
        .input-dark:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); }
        .toast-enter { animation: slideIn 0.4s forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="p-8 relative min-h-screen">
    <div id="toast-container" class="fixed top-5 right-5 flex flex-col gap-3 z-50"></div>

    <div class="max-w-[1500px] mx-auto relative z-10">
        
        <!-- HEADER SUPERADMIN -->
        <header class="flex justify-between items-center mb-10 pb-6 border-b border-[#27272a]">
            <div>
                <h1 class="text-4xl font-black tracking-tight mb-1 flex items-center gap-2">
                    <span class="text-white">Consola</span> 
                    <span class="text-blue-500">Central</span>
                </h1>
                <p class="text-xs font-semibold text-blue-600 uppercase tracking-widest mt-1">Gestión Global de Franquicias</p>
            </div>
            <button id="btn-logout" class="bg-[#1f1f23] border border-[#27272a] text-gray-400 hover:text-white transition px-6 py-3 rounded-full text-xs font-bold uppercase tracking-widest hover:bg-red-900/20 hover:border-red-500/30">
                Cerrar Sesión
            </button>
        </header>
        
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-8">
            <!-- FORMULARIO NUEVA LICENCIA -->
            <div class="glass-card p-8 xl:col-span-4 h-fit shadow-2xl">
                <div class="flex justify-between items-center mb-8 border-b border-[#27272a] pb-4">
                    <h2 id="form-title" class="text-xl font-bold text-white flex items-center gap-2">
                        <span class="text-blue-500">➕</span> Nuevo Despliegue SaaS
                    </h2>
                    <button id="btn-cancelar-edicion" class="hidden text-xs bg-gray-800 text-gray-300 px-3 py-1.5 rounded-full hover:bg-gray-700 transition font-bold">Cancelar</button>
                </div>
                
                <form id="form-gym" class="space-y-5">
                    <input type="hidden" id="edit-gym-id">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-xs font-semibold text-gray-400 mb-2">Nombre Comercial</label><input type="text" id="gym-nombre" class="w-full input-dark rounded-xl p-3 text-sm" placeholder="Ej. Titan Gym" required></div>
                        <div><label class="block text-xs font-semibold text-blue-400 mb-2">Usuario Login</label><input type="text" id="gym-username" class="w-full input-dark rounded-xl p-3 text-sm border-blue-500/30" required></div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-xs font-semibold text-emerald-400 mb-2">Clave Dueño</label><input type="text" id="gym-password" class="w-full input-dark rounded-xl p-3 text-sm border-emerald-500/30" required></div>
                        <div><label class="block text-xs font-semibold text-orange-400 mb-2">Clave Staff</label><input type="text" id="gym-password-staff" class="w-full input-dark rounded-xl p-3 text-sm border-orange-500/30" required></div>
                    </div>

                    <div class="grid grid-cols-4 gap-4 items-end">
                        <div class="col-span-2"><label class="block text-xs font-semibold text-gray-400 mb-2">URL Logo</label><input type="url" id="gym-logo" class="w-full input-dark rounded-xl p-3 text-xs" placeholder="https://..."></div>
                        <div class="col-span-1"><label class="block text-xs font-semibold text-gray-400 mb-2 text-center">Color Base</label>
                            <input type="color" id="gym-color" class="h-10 w-full rounded-xl cursor-pointer bg-transparent border border-[#27272a] p-1" value="#eab308">
                        </div>
                        <div class="col-span-1"><label class="block text-[10px] font-bold text-blue-400 uppercase mb-2">Vence</label><input type="date" id="gym-licencia" class="w-full input-dark rounded-xl p-3 text-[10px]" required></div>
                    </div>
                    
                    <div class="pt-4 border-t border-[#27272a] mt-6">
                        <label class="block text-xs font-semibold text-gray-500 mb-3">Módulos Contratados (Pro)</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center space-x-2 bg-[#121214] p-3 rounded-xl border border-[#27272a] cursor-pointer"><input type="checkbox" id="mod-tienda" checked class="accent-blue-500"><span class="text-sm font-medium text-gray-300">Tienda POS</span></label>
                            <label class="flex items-center space-x-2 bg-[#121214] p-3 rounded-xl border border-[#27272a] cursor-pointer"><input type="checkbox" id="mod-evaluaciones" checked class="accent-blue-500"><span class="text-sm font-medium text-gray-300">Fichas Físicas</span></label>
                        </div>
                    </div>
                    <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-500 transition mt-6 shadow-[0_0_20px_rgba(37,99,235,0.3)]">Generar Instancia</button>
                </form>
            </div>

            <!-- DIRECTORIO DE CLIENTES -->
            <div class="glass-card p-8 xl:col-span-8 shadow-2xl flex flex-col min-h-[600px]">
                <h2 class="text-xl font-bold mb-6 text-white border-b border-[#27272a] pb-4">Directorio Global de Licencias</h2>
                
                <div class="overflow-x-auto w-full flex-1">
                    <table class="w-full text-left border-collapse" id="table-gyms">
                        <thead>
                            <tr class="border-b border-[#27272a] text-gray-500 text-xs font-semibold tracking-wider">
                                <th class="py-4 px-4 w-10">St</th>
                                <th class="py-4 px-4">Instancia Comercial</th>
                                <th class="py-4 px-4">Accesos de Entorno</th>
                                <th class="py-4 px-4">Suscripción</th>
                                <th class="py-4 px-4 text-right">Administrar</th>
                            </tr>
                        </thead>
                        <tbody id="lista-gyms" class="text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE ADMIN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, updateDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCZ2UaN7J_r7AVA9RCn945JrF2wMol-hh8", authDomain: "novagym-saas-enterprise.firebaseapp.com", projectId: "novagym-saas-enterprise", storageBucket: "novagym-saas-enterprise.firebasestorage.app" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        let gymsData = [];

        window.showToast = (msg, tipo = 'success') => {
            const container = document.getElementById('toast-container'); 
            const toast = document.createElement('div');
            const bg = tipo === 'success' ? 'bg-[#18181b] border-l-4 border-emerald-500 text-emerald-400' : 'bg-[#18181b] border-l-4 border-red-500 text-red-400';
            toast.className = `toast-enter ${bg} border-y border-r border-[#27272a] px-6 py-4 rounded-r-xl shadow-2xl font-bold text-sm flex items-center gap-3`;
            toast.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${tipo==='success'?'M5 13l4 4L19 7':'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z'}"></path></svg> <span class="text-white">${msg}</span>`;
            container.appendChild(toast); setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        };

        document.getElementById('btn-logout').addEventListener('click', () => { sessionStorage.removeItem('nems_admin_token'); window.location.href = 'index.html'; });

        const colorInput = document.getElementById('gym-color'); 
        if(colorInput) colorInput.addEventListener('input', (e) => colorInput.style.boxShadow = `0 0 15px ${e.target.value}40`);

        async function cargarGimnasios() {
            const tbody = document.getElementById('lista-gyms'); tbody.innerHTML = '';
            const querySnapshot = await getDocs(collection(db, "gimnasios"));
            gymsData = []; querySnapshot.forEach(d => gymsData.push({id: d.id, ...d.data()}));

            if(gymsData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-gray-500 italic text-xs">No hay franquicias registradas.</td></tr>`; return;
            }

            gymsData.forEach((data) => {
                const isSuspendido = data.estado === 'suspendido';
                const tr = document.createElement('tr'); tr.className = `border-b border-[#27272a] transition hover:bg-[#18181b] ${isSuspendido ? 'opacity-60' : ''}`;
                tr.innerHTML = `
                    <td class="py-4 px-4"><div class="w-3 h-3 rounded-full ${isSuspendido ? 'bg-red-500' : 'bg-emerald-500'}"></div></td>
                    <td class="py-4 px-4">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl bg-[#121214] border border-[#27272a] flex items-center justify-center p-1" style="box-shadow: 0 0 10px ${data.colorPrimario}40">
                                ${data.logoUrl ? `<img src="${data.logoUrl}" class="w-full h-full object-contain">` : `<span style="color:${data.colorPrimario}" class="font-bold text-xs">GYM</span>`}
                            </div>
                            <span class="font-bold text-white text-base">${data.nombre}</span>
                        </div>
                    </td>
                    <td class="py-4 px-4">
                        <div class="flex flex-col gap-1 text-xs font-mono">
                            <span class="text-blue-400">@${data.username}</span>
                            <span class="text-emerald-400">Admin: ${data.password}</span>
                            <span class="text-orange-400">Staff: ${data.passwordStaff || 'No asignada'}</span>
                        </div>
                    </td>
                    <td class="py-4 px-4"><span class="px-3 py-1 rounded-full text-xs font-semibold ${isSuspendido ? 'bg-red-900/30 text-red-400' : 'bg-gray-800 text-gray-300'}">${data.vencimientoLicencia ? data.vencimientoLicencia.split('-').reverse().join('/') : '-'}</span></td>
                    <td class="py-4 px-4 flex justify-end gap-2 items-center">
                        <button class="btn-toggle text-xs px-3 py-1.5 rounded-full transition ${isSuspendido ? 'bg-emerald-900/30 text-emerald-400 hover:bg-emerald-600 hover:text-white' : 'bg-orange-900/30 text-orange-400 hover:bg-orange-600 hover:text-white'}" data-id="${data.id}" data-estado="${data.estado}">${isSuspendido ? 'Reactivar' : 'Pausar'}</button>
                        <button class="btn-editar bg-gray-800 text-white px-4 py-1.5 rounded-full text-xs font-bold hover:bg-gray-700 transition" data-id="${data.id}">Editar</button>
                        <button class="btn-eliminar bg-red-900/30 text-red-500 border border-red-500/30 px-3 py-1.5 rounded-full text-xs font-bold hover:bg-red-600 hover:text-white transition" data-id="${data.id}" title="Borrar Definitivamente">Borrar</button>
                    </td>`;
                tbody.appendChild(tr);
            });
        }

        document.body.addEventListener('click', async (e) => {
            if (e.target.classList.contains('btn-toggle')) {
                const id = e.target.dataset.id; const nuevoEstado = e.target.dataset.estado === 'activo' ? 'suspendido' : 'activo';
                if(confirm(`¿Cambiar estado a ${nuevoEstado.toUpperCase()}?`)) { await updateDoc(doc(db, "gimnasios", id), { estado: nuevoEstado }); showToast(`Franquicia ${nuevoEstado}`, nuevoEstado === 'activo' ? 'success' : 'error'); cargarGimnasios(); }
            }
            if (e.target.classList.contains('btn-eliminar')) {
                const id = e.target.dataset.id;
                if(confirm(`⚠️ ATENCIÓN: ¿Eliminar DEFINITIVAMENTE este gimnasio y borrarlo de los registros? Esta acción es irreversible.`)) { 
                    await deleteDoc(doc(db, "gimnasios", id)); 
                    showToast(`Franquicia eliminada permanentemente`, 'error'); 
                    cargarGimnasios(); 
                }
            }
            if (e.target.classList.contains('btn-editar')) {
                const gym = gymsData.find(g => g.id === e.target.dataset.id);
                document.getElementById('form-title').innerHTML = `<span class="text-blue-500 text-xl">✏️</span> Modificar Despliegue`;
                document.getElementById('edit-gym-id').value = gym.id; 
                document.getElementById('gym-nombre').value = gym.nombre || '';
                document.getElementById('gym-username').value = gym.username || ''; 
                document.getElementById('gym-password').value = gym.password || '';
                document.getElementById('gym-password-staff').value = gym.passwordStaff || '';
                
                const cInput = document.getElementById('gym-color'); if(cInput) cInput.value = gym.colorPrimario || '#eab308'; 
                const lInput = document.getElementById('gym-logo'); if(lInput) lInput.value = gym.logoUrl || '';
                const vInput = document.getElementById('gym-licencia'); 
                if(vInput) { if(gym.vencimientoLicencia) vInput.value = gym.vencimientoLicencia; else { const d = new Date(); d.setMonth(d.getMonth() + 1); vInput.value = d.toISOString().split('T')[0]; } }

                const m = gym.modulos || {};
                const c4 = document.getElementById('mod-tienda'); if(c4) c4.checked = !!m.tienda;
                const c6 = document.getElementById('mod-evaluaciones'); if(c6) c6.checked = !!m.evaluaciones;
                
                document.getElementById('btn-submit').innerText = "Guardar Cambios"; 
                document.getElementById('btn-cancelar-edicion').classList.remove('hidden');
            }
        });

        document.getElementById('form-gym').addEventListener('submit', async (e) => {
            e.preventDefault(); const btn = document.getElementById('btn-submit'); btn.innerHTML = 'Procesando...'; btn.disabled = true;
            const editId = document.getElementById('edit-gym-id').value;
            
            const gymData = { 
                nombre: document.getElementById('gym-nombre').value, 
                username: document.getElementById('gym-username').value.trim(), 
                colorPrimario: document.getElementById('gym-color').value, 
                password: document.getElementById('gym-password').value, 
                passwordStaff: document.getElementById('gym-password-staff').value, 
                logoUrl: document.getElementById('gym-logo').value.trim(), 
                vencimientoLicencia: document.getElementById('gym-licencia').value,
                modulos: { tienda: document.getElementById('mod-tienda').checked, evaluaciones: document.getElementById('mod-evaluaciones').checked } 
            };
            
            try {
                if (editId) { await updateDoc(doc(db, "gimnasios", editId), gymData); showToast('Configuración actualizada'); } 
                else { gymData.estado = 'activo'; gymData.fechaCreacion = new Date().toISOString(); await addDoc(collection(db, "gimnasios"), gymData); showToast('Nuevo entorno desplegado exitosamente'); }
                document.getElementById('btn-cancelar-edicion').click(); cargarGimnasios();
            } catch (error) { showToast("Error al guardar", 'error'); } finally { btn.disabled = false; }
        });
        
        document.getElementById('btn-cancelar-edicion').addEventListener('click', () => { 
            document.getElementById('form-gym').reset(); 
            document.getElementById('edit-gym-id').value = ""; 
            document.getElementById('form-title').innerHTML = `<span class="text-blue-500 text-xl">➕</span> Nuevo Despliegue SaaS`; 
            document.getElementById('btn-submit').innerText = "Generar Instancia"; 
            document.getElementById('btn-cancelar-edicion').classList.add('hidden'); 
        });

        cargarGimnasios();
    </script>
</body>
</html>
