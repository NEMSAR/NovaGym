<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin | NEMS OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #040814; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-dark { background: rgba(0,0,0,0.5); border: 1px solid rgba(255, 255, 255, 0.1); color: white; }
        .input-dark:focus { outline: none; border-color: #8b5cf6; }
        .toast-enter { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="p-8 relative">

    <!-- Contenedor de Notificaciones -->
    <div id="toast-container" class="fixed bottom-5 right-5 flex flex-col gap-3 z-50"></div>

    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-10 border-b border-gray-800 pb-6">
            <div>
                <h1 class="text-3xl font-black tracking-tight text-white">Consola <span class="text-blue-500">Super Admin</span></h1>
                <p class="text-gray-400 text-sm mt-1">Gestión global NEMS Tech Enterprise</p>
            </div>
            <a href="index.html" class="text-gray-400 hover:text-white transition px-4 py-2 rounded-lg hover:bg-white/5 border border-transparent hover:border-gray-700">
                Finalizar Sesión
            </a>
        </header>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="glass-card p-6 rounded-2xl lg:col-span-1 h-fit">
                <h2 class="text-xl font-bold mb-6">➕ Nuevo Inquilino</h2>
                <form id="form-nuevo-gym" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Nombre del Gimnasio</label>
                        <input type="text" id="gym-nombre" class="w-full input-dark rounded-lg p-3" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Color Interfaz (Hex)</label>
                        <div class="flex items-center gap-3">
                            <input type="color" id="gym-color" class="h-10 w-12 rounded cursor-pointer bg-transparent border-0 p-0" value="#8b5cf6">
                            <input type="text" id="gym-color-text" class="w-full input-dark rounded-lg p-3 text-sm" value="#8b5cf6" readonly>
                        </div>
                    </div>
                    
                    <div class="pt-4 border-t border-gray-800">
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-4">Servicios Habilitados</label>
                        <label class="flex items-center space-x-3 mb-2 cursor-pointer p-2 hover:bg-white/5 rounded-lg"><input type="checkbox" id="mod-musculacion" class="w-4 h-4 accent-blue-500" checked><span class="text-sm">Musculación</span></label>
                        <label class="flex items-center space-x-3 mb-2 cursor-pointer p-2 hover:bg-white/5 rounded-lg"><input type="checkbox" id="mod-funcional" class="w-4 h-4 accent-blue-500"><span class="text-sm">Área Funcional</span></label>
                        <label class="flex items-center space-x-3 mb-2 cursor-pointer p-2 hover:bg-white/5 rounded-lg"><input type="checkbox" id="mod-pilates" class="w-4 h-4 accent-blue-500"><span class="text-sm">Clases de Pilates</span></label>
                        
                        <label class="block text-xs font-bold text-gray-400 uppercase mt-4 mb-2">Módulos Extra</label>
                        <label class="flex items-center space-x-3 mb-2 cursor-pointer p-2 hover:bg-white/5 rounded-lg"><input type="checkbox" id="mod-tienda" class="w-4 h-4 accent-emerald-500" checked><span class="text-sm">Tienda / Ventas (POS)</span></label>
                    </div>
                    
                    <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-blue-500 transition mt-4">
                        Desplegar Entorno
                    </button>
                </form>
            </div>

            <div class="glass-card p-6 rounded-2xl lg:col-span-2">
                <h2 class="text-xl font-bold mb-6">Inquilinos Activos</h2>
                <div id="loading-gyms" class="text-center py-10 text-gray-500">Sincronizando con base de datos...</div>
                <ul id="lista-gyms" class="space-y-4 hidden"></ul>
            </div>
        </div>
    </div>

    <!-- Script Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZ2UaN7J_r7AVA9RCn945JrF2wMol-hh8",
            authDomain: "novagym-saas-enterprise.firebaseapp.com",
            projectId: "novagym-saas-enterprise",
            storageBucket: "novagym-saas-enterprise.firebasestorage.app",
            messagingSenderId: "578362101056",
            appId: "1:578362101056:web:d7833a58d16987acdb3ea5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Sistema de Toasts Premium
        window.showToast = (msg, tipo = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = tipo === 'success' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-400' : 'bg-red-500/20 border-red-500/50 text-red-400';
            toast.className = `toast-enter ${bg} border px-6 py-4 rounded-xl shadow-lg backdrop-blur-md font-bold text-sm flex items-center gap-3`;
            toast.innerHTML = `<span>${tipo === 'success' ? '✓' : '⚠️'}</span> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        };

        const form = document.getElementById('form-nuevo-gym');
        const listaGyms = document.getElementById('lista-gyms');
        const colorInput = document.getElementById('gym-color');
        const colorText = document.getElementById('gym-color-text');

        colorInput.addEventListener('input', (e) => colorText.value = e.target.value);

        window.toggleEstadoGym = async (id, estadoActual) => {
            const nuevoEstado = estadoActual === 'activo' ? 'suspendido' : 'activo';
            if(confirm(`¿Estás seguro de cambiar el estado a ${nuevoEstado.toUpperCase()}?`)) {
                await updateDoc(doc(db, "gimnasios", id), { estado: nuevoEstado });
                showToast(`Gimnasio ${nuevoEstado}`, nuevoEstado === 'activo' ? 'success' : 'error');
                cargarGimnasios();
            }
        };

        async function cargarGimnasios() {
            listaGyms.innerHTML = '';
            const querySnapshot = await getDocs(collection(db, "gimnasios"));
            document.getElementById('loading-gyms').classList.add('hidden');
            listaGyms.classList.remove('hidden');

            if (querySnapshot.empty) {
                listaGyms.innerHTML = '<li class="text-gray-500 text-center py-5">No hay gimnasios registrados.</li>'; return;
            }

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data(); const id = docSnap.id; 
                const isSuspendido = data.estado === 'suspendido';
                const li = document.createElement('li');
                li.className = `flex flex-col md:flex-row justify-between md:items-center p-5 rounded-xl border transition gap-4 ${isSuspendido ? 'bg-red-900/10 border-red-500/30' : 'bg-white/5 border-white/10 hover:bg-white/10'}`;
                li.style.borderLeft = `4px solid ${isSuspendido ? '#ef4444' : (data.colorPrimario || '#3b82f6')}`;
                
                let modulosTags = '';
                if(data.modulos?.musculacion) modulosTags += `<span class="text-[10px] bg-black/50 px-2 py-1 rounded">Musculación</span> `;
                if(data.modulos?.funcional) modulosTags += `<span class="text-[10px] bg-black/50 px-2 py-1 rounded">Funcional</span> `;
                if(data.modulos?.pilates) modulosTags += `<span class="text-[10px] bg-black/50 px-2 py-1 rounded">Pilates</span> `;
                if(data.modulos?.tienda) modulosTags += `<span class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-1 rounded">Tienda POS</span> `;

                li.innerHTML = `
                    <div>
                        <div class="flex items-center gap-3">
                            <p class="font-bold text-lg text-white ${isSuspendido ? 'line-through text-gray-500' : ''}">${data.nombre}</p>
                            ${isSuspendido ? '<span class="text-[10px] font-bold uppercase tracking-wider bg-red-500/20 text-red-400 px-2 py-0.5 rounded border border-red-500/30">Suspendido</span>' : '<span class="text-[10px] font-bold uppercase tracking-wider bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/30">Activo</span>'}
                        </div>
                        <p class="text-xs text-gray-400 font-mono mb-2 mt-1">ID: <span class="text-white select-all bg-black/50 px-1 rounded">${id}</span></p>
                        <div class="flex gap-2 flex-wrap">${modulosTags}</div>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <button onclick="toggleEstadoGym('${id}', '${data.estado}')" class="text-xs font-bold px-4 py-2 rounded-lg transition ${isSuspendido ? 'bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white' : 'bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white'}">
                            ${isSuspendido ? '✅ Activar' : '⛔ Suspender'}
                        </button>
                        <a href="gym.html?id=${id}" target="_blank" class="text-sm bg-blue-600/20 border border-blue-500/50 text-blue-400 font-bold px-5 py-2.5 rounded-lg hover:bg-blue-600 hover:text-white transition text-center">Abrir Panel</a>
                    </div>
                `;
                listaGyms.appendChild(li);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit'); btn.innerHTML = 'Desplegando...'; btn.disabled = true;
            try {
                await addDoc(collection(db, "gimnasios"), {
                    nombre: document.getElementById('gym-nombre').value, colorPrimario: document.getElementById('gym-color').value,
                    estado: 'activo', fechaCreacion: new Date().toISOString(),
                    modulos: {
                        musculacion: document.getElementById('mod-musculacion').checked, funcional: document.getElementById('mod-funcional').checked,
                        pilates: document.getElementById('mod-pilates').checked, tienda: document.getElementById('mod-tienda').checked
                    }
                });
                form.reset(); colorText.value = '#8b5cf6'; colorInput.value = '#8b5cf6';
                showToast('Gimnasio desplegado exitosamente');
                cargarGimnasios();
            } catch (error) { showToast("Error al guardar", 'error'); } 
            finally { btn.innerHTML = 'Desplegar Entorno'; btn.disabled = false; }
        });
        cargarGimnasios();
    </script>
</body>
</html>
