<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Super Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Panel Super Admin (Gestión de Gimnasios)</h1>
            <a href="index.html" class="text-blue-600 font-bold hover:underline">⬅ Volver al inicio</a>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Formulario de Alta -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-4">Alta de Nuevo Gimnasio</h2>
                <form id="form-nuevo-gym" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nombre del Gimnasio</label>
                        <input type="text" id="gym-nombre" class="mt-1 w-full border border-gray-300 rounded p-2" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Color Principal</label>
                        <input type="color" id="gym-color" class="mt-1 w-full h-10 cursor-pointer" value="#ea580c">
                    </div>
                    
                    <div class="pt-4 border-t">
                        <h3 class="font-bold mb-2">Módulos Opcionales</h3>
                        <label class="flex items-center space-x-2 mb-2">
                            <input type="checkbox" id="mod-funcional" checked>
                            <span>Gestión de Funcional</span>
                        </label>
                        <label class="flex items-center space-x-2 mb-2">
                            <input type="checkbox" id="mod-pilates">
                            <span>Gestión de Pilates</span>
                        </label>
                        <label class="flex items-center space-x-2 mb-2">
                            <input type="checkbox" id="mod-biometria" checked>
                            <span>Conexión Biométrica / Huella</span>
                        </label>
                    </div>
                    
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700">
                        Crear Gimnasio
                    </button>
                </form>
            </div>

            <!-- Lista de Gimnasios -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-4">Mis Clientes Activos</h2>
                <ul id="lista-gyms" class="space-y-3">
                    <!-- Los gimnasios se agregarán aquí con JS -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        // Lógica temporal con Vanilla JS
        const form = document.getElementById('form-nuevo-gym');
        const listaGyms = document.getElementById('lista-gyms');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('gym-nombre').value;
            const color = document.getElementById('gym-color').value;
            
            const li = document.createElement('li');
            li.className = "border p-4 rounded flex justify-between items-center shadow-sm";
            li.style.borderLeft = `5px solid ${color}`;
            
            li.innerHTML = `
                <div>
                    <p class="font-bold text-lg">${nombre}</p>
                    <p class="text-xs text-green-700 font-bold bg-green-100 px-2 py-1 rounded inline-block mt-1">Activo</p>
                </div>
                <button class="text-sm bg-red-100 text-red-600 font-bold px-3 py-1 rounded hover:bg-red-200">Suspender</button>
            `;
            
            listaGyms.appendChild(li);
            form.reset();
        });
    </script>
<!-- Importamos Firebase como módulo al final del body -->

    // 2. Tu configuración (Reemplaza con los datos que te dio Firebase)

  authDomain: "novagym-saas-enterprise.firebaseapp.com",
  projectId: "novagym-saas-enterprise",
  storageBucket: "novagym-saas-enterprise.firebasestorage.app",

    // Hacemos que la base de datos sea accesible globalmente en la ventana (para usarla en otros scripts si lo necesitas)

    window.getDocs = getDocs;

    console.log("🔥 Firebase conectado con éxito!");
</script>
    
</body>
</html>
