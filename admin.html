<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consola Central | NEMS Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>if(sessionStorage.getItem('nems_admin_token') !== 'autorizado_2026') window.location.href = 'index.html';</script>
    <style>
        body { background-color: #09090b; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
        .glass-card { background: #121214; border: 1px solid #27272a; position: relative; z-index: 10; border-radius: 2rem; }
        .input-dark { background: #18181b; border: 1px solid #27272a; color: white; transition: all 0.3s; }
        .input-dark:focus { outline: none; border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255, 0.1); }
        .toast-enter { animation: slideIn 0.4s forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .aurora-bg {
            position: absolute; top: -50px; left: -10%; width: 120%; height: 450px;
            background: linear-gradient(270deg, #3b82f6, #8b5cf6, #ec4899, #8b5cf6, #3b82f6);
            background-size: 400% 400%; filter: blur(80px); opacity: 0.15; z-index: 0;
            animation: auroraSweep 10s ease infinite; pointer-events: none; transition: opacity 0.5s ease;
        }
        .aurora-disabled .aurora-bg { opacity: 0 !important; animation: none !important; }
        @keyframes auroraSweep { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    </style>
</head>
<body class="p-8 relative min-h-screen">
    <div class="aurora-bg"></div>
    <div id="toast-container" class="fixed top-5 right-5 flex flex-col gap-3 z-50"></div>

    <div class="max-w-[1500px] mx-auto relative z-10">
        <!-- HEADER ADMIN ESTILO BLUEROCK -->
        <header class="flex justify-between items-center mb-10 bg-[#121214] border border-[#27272a] rounded-[2rem] p-4 px-8 shadow-xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-black font-black text-xl">N</div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">Consola Matriz</h1>
                    <p class="text-[10px] font-medium text-gray-500 uppercase tracking-widest mt-0.5">Gestión SaaS Global</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <button id="btn-toggle-fx" class="text-xs bg-[#18181b] border border-[#27272a] hover:text-white hover:border-gray-500 transition px-5 py-2.5 rounded-full font-bold">Fx</button>
                <button id="btn-logout" class="bg-white text-black hover:bg-gray-200 transition px-6 py-2.5 rounded-full text-xs font-bold shadow-lg">Cerrar Sesión</button>
            </div>
        </header>
        
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-8">
            <!-- PANEL IZQUIERDO: FORMULARIO -->
            <div class="glass-card p-8 xl:col-span-4 h-fit shadow-2xl">
                <div class="flex justify-between items-center mb-8">
                    <h2 id="form-title" class="text-lg font-medium text-white flex items-center gap-3">
                        <span class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-sm">➕</span> Nuevo Cliente
                    </h2>
                    <button id="btn-cancelar-edicion" class="hidden text-xs bg-[#18181b] border border-[#27272a] text-gray-400 hover:text-white px-4 py-2 rounded-full transition font-bold">Cancelar</button>
                </div>
                
                <form id="form-gym" class="space-y-6">
                    <input type="hidden" id="edit-gym-id">
                    
                    <div class="space-y-4">
                        <div><label class="block text-[10px] font-medium text-gray-500 uppercase mb-2 ml-1">Nombre Comercial</label><input type="text" id="gym-nombre" class="w-full input-dark rounded-xl p-3.5 text-sm" placeholder="Ej. Titan Gym" required></div>
                        <div><label class="block text-[10px] font-medium text-gray-500 uppercase mb-2 ml-1">Usuario Acceso</label><input type="text" id="gym-username" class="w-full input-dark rounded-xl p-3.5 text-sm" placeholder="Ej. titangym" required></div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-[10px] font-medium text-gray-500 uppercase mb-2 ml-1">Clave Dueño</label><input type="text" id="gym-password" class="w-full input-dark rounded-xl p-3.5 text-sm" placeholder="***" required></div>
                        <div><label class="block text-[10px] font-medium text-gray-500 uppercase mb-2 ml-1">Clave Staff</label><input type="text" id="gym-password-staff" class="w-full input-dark rounded-xl p-3.5 text-sm" placeholder="***" required></div>
                    </div>

                    <div class="grid grid-cols-3 gap-4 items-end">
                        <div class="col-span-2"><label class="block text-[10px] font-medium text-gray-500 uppercase mb-2 ml-1">URL Logo PNG</label><input type="url" id="gym-logo" class="w-full input-dark rounded-xl p-3.5 text-xs" placeholder="https://..."></div>
                        <div class="col-span-1"><label class="block text-[10px] font-medium text-gray-500 uppercase mb-2 ml-1 text-center">Tono (HEX)</label>
                            <input type="color" id="gym-color" class="h-[46px] w-full rounded-xl cursor-pointer bg-transparent border-0 p-0 shadow-sm" value="#a3e635">
                        </div>
                    </div>
                    
                    <div class="bg-[#18181b] rounded-2xl p-5 border border-[#27272a]">
                        <label class="block text-[10px] font-medium text-gray-400 uppercase tracking-widest mb-4">Módulos Asignados</label>
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <label class="flex items-center space-x-2"><input type="checkbox" id="mod-musculacion" checked class="accent-white w-4 h-4"><span class="text-xs text-gray-300">Musculación</span></label>
                            <label class="flex items-center space-x-2"><input type="checkbox" id="mod-funcional" class="accent-white w-4 h-4"><span class="text-xs text-gray-300">Funcional</span></label>
                            <label class="flex items-center space-x-2"><input type="checkbox" id="mod-pilates" class="accent-white w-4 h-4"><span class="text-xs text-gray-300">Pilates</span></label>
                        </div>
                        <div class="w-full h-px bg-[#27272a] my-3"></div>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center space-x-2"><input type="checkbox" id="mod-tienda" checked class="accent-white w-4 h-4"><span class="text-xs text-gray-300">Tienda POS</span></label>
                            <label class="flex items-center space-x-2"><input type="checkbox" id="mod-asistencia" class="accent-white w-4 h-4"><span class="text-xs text-gray-300">Asistencia QR</span></label>
                            <label class="flex items-center space-x-2"><input type="checkbox" id="mod-evaluaciones" class="accent-white w-4 h-4"><span class="text-xs text-gray-300">Fichas Físicas</span></label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-medium text-blue-400 uppercase mb-2 ml-1">Corte Licencia SaaS</label>
                        <input type="date" id="gym-licencia" class="w-full input-dark rounded-xl p-3.5 text-sm" required>
                    </div>

                    <button type="submit" id="btn-submit" class="w-full bg-white text-black font-bold py-4 rounded-xl hover:bg-gray-200 transition mt-2 shadow-xl tracking-wide">Desplegar Instancia</button>
                </form>
            </div>

            <!-- PANEL DERECHO: TABLA DE GIMNASIOS -->
            <div class="glass-card p-8 xl:col-span-8 shadow-2xl flex flex-col">
                <div class="flex justify-between items-center mb-8 border-b border-[#27272a] pb-4">
                    <h2 class="text-lg font-medium text-white">Directorio de Franquicias</h2>
                </div>
                
                <div class="overflow-x-auto w-full flex-1">
                    <table class="w-full text-left border-collapse text-sm" id="table-gyms">
                        <thead>
                            <tr class="border-b border-[#27272a] text-gray-500 text-[10px] uppercase tracking-widest">
                                <th class="py-4 px-4 font-medium">St</th>
                                <th class="py-4 px-4 font-medium">Cliente</th>
                                <th class="py-4 px-4 font-medium">Credenciales</th>
                                <th class="py-4 px-4 font-medium">SaaS</th>
                                <th class="py-4 px-4 text-right font-medium">Controles</th>
                            </tr>
                        </thead>
                        <tbody id="lista-gyms" class="divide-y divide-[#27272a]"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE CONTROL -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCZ2UaN7J_r7AVA9RCn945JrF2wMol-hh8", authDomain: "novagym-saas-enterprise.firebaseapp.com", projectId: "novagym-saas-enterprise", storageBucket: "novagym-saas-enterprise.firebasestorage.app", messagingSenderId: "578362101056", appId: "1:578362101056:web:d7833a58d16987acdb3ea5" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        let gymsData = [];

        window.showToast = (msg, tipo = 'success') => {
            const container = document.getElementById('toast-container'); if(!container) return;
            const toast = document.createElement('div');
            const bg = tipo === 'success' ? 'bg-[#18181b] border-l-4 border-white' : 'bg-[#18181b] border-l-4 border-red-500';
            toast.className = `toast-enter ${bg} border-y border-r border-[#27272a] px-6 py-4 rounded-r-2xl shadow-2xl font-medium text-sm flex items-center gap-3`;
            toast.innerHTML = `<span class="text-white">${msg}</span>`;
            container.appendChild(toast); setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        };

        const elLicencia = document.getElementById('gym-licencia');
        if(elLicencia) { const d = new Date(); d.setMonth(d.getMonth() + 1); elLicencia.value = d.toISOString().split('T')[0]; }

        document.getElementById('btn-logout').addEventListener('click', () => { sessionStorage.removeItem('nems_admin_token'); window.location.href = 'index.html'; });

        async function cargarGimnasios() {
            const tbody = document.getElementById('lista-gyms'); tbody.innerHTML = '';
            const querySnapshot = await getDocs(collection(db, "gimnasios"));
            gymsData = []; querySnapshot.forEach((docSnap) => gymsData.push({id: docSnap.id, ...docSnap.data()}));

            gymsData.forEach((data) => {
                const isSuspendido = data.estado === 'suspendido';
                const fVence = data.vencimientoLicencia ? data.vencimientoLicencia.split('-').reverse().join('/') : 'Sin Asignar';
                
                const tr = document.createElement('tr'); tr.className = `transition hover:bg-[#18181b] group ${isSuspendido ? 'opacity-50' : ''}`;
                tr.innerHTML = `
                    <td class="py-4 px-4"><div class="w-2.5 h-2.5 rounded-full ${isSuspendido ? 'bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.5)]' : 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.5)]'}"></div></td>
                    <td class="py-4 px-4"><div class="flex items-center gap-3">${data.logoUrl ? `<img src="${data.logoUrl}" class="w-10 h-10 rounded-full object-cover border border-[#27272a] bg-black p-1">` : `<div class="w-10 h-10 rounded-full bg-[#18181b] border border-[#27272a] flex items-center justify-center font-bold text-xs" style="color:${data.colorPrimario||'#fff'}">N</div>`}<span class="font-medium text-white">${data.nombre}</span></div></td>
                    <td class="py-4 px-4">
                        <div class="flex flex-col gap-1">
                            <span class="font-mono text-[11px] text-gray-300 bg-[#18181b] border border-[#27272a] px-2 py-0.5 rounded-md w-fit">User: ${data.username}</span>
                            <span class="font-mono text-[10px] text-gray-500">D: ${data.password} | S: ${data.passwordStaff || '-'}</span>
                        </div>
                    </td>
                    <td class="py-4 px-4 font-mono text-[11px] text-gray-400">${fVence}</td>
                    <td class="py-4 px-4 flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button class="btn-editar text-xs bg-[#18181b] border border-[#27272a] text-gray-400 hover:text-white px-4 py-2 rounded-full transition" data-id="${data.id}">Editar</button>
                        <button class="btn-toggle text-xs bg-[#18181b] border border-[#27272a] text-gray-400 hover:text-white px-4 py-2 rounded-full transition" data-id="${data.id}" data-estado="${data.estado}">${isSuspendido ? 'Activar' : 'Pausar'}</button>
                    </td>`;
                tbody.appendChild(tr);
            });
        }

        document.body.addEventListener('click', async (e) => {
            if (e.target.classList.contains('btn-toggle')) {
                const id = e.target.dataset.id; const nuevo = e.target.dataset.estado === 'activo' ? 'suspendido' : 'activo';
                await updateDoc(doc(db, "gimnasios", id), { estado: nuevo }); showToast(`Instancia ${nuevo}`, 'success'); cargarGimnasios();
            }
            if (e.target.classList.contains('btn-editar')) {
                const gym = gymsData.find(g => g.id === e.target.dataset.id);
                document.getElementById('form-title').innerHTML = `<span class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-sm">✏️</span> Edición SaaS`;
                document.getElementById('edit-gym-id').value = gym.id; 
                document.getElementById('gym-nombre').value = gym.nombre || ''; document.getElementById('gym-username').value = gym.username || ''; 
                document.getElementById('gym-password').value = gym.password || ''; document.getElementById('gym-password-staff').value = gym.passwordStaff || '';
                document.getElementById('gym-color').value = gym.colorPrimario || '#a3e635'; document.getElementById('gym-logo').value = gym.logoUrl || '';
                document.getElementById('gym-licencia').value = gym.vencimientoLicencia || new Date().toISOString().split('T')[0];

                const m = gym.modulos || {};
                ['musculacion', 'funcional', 'pilates', 'tienda', 'asistencia', 'evaluaciones'].forEach(mod => { document.getElementById(`mod-${mod}`).checked = !!m[mod]; });
                
                document.getElementById('btn-submit').innerText = "Guardar Cambios"; document.getElementById('btn-cancelar-edicion').classList.remove('hidden');
            }
        });

        document.getElementById('form-gym').addEventListener('submit', async (e) => {
            e.preventDefault(); const btn = document.getElementById('btn-submit'); btn.innerHTML = 'Procesando...'; btn.disabled = true;
            const editId = document.getElementById('edit-gym-id').value;
            const gymData = { 
                nombre: document.getElementById('gym-nombre').value, username: document.getElementById('gym-username').value.trim(), 
                colorPrimario: document.getElementById('gym-color').value, password: document.getElementById('gym-password').value, 
                passwordStaff: document.getElementById('gym-password-staff').value, logoUrl: document.getElementById('gym-logo').value.trim(), 
                vencimientoLicencia: document.getElementById('gym-licencia').value,
                modulos: { musculacion: document.getElementById('mod-musculacion').checked, funcional: document.getElementById('mod-funcional').checked, pilates: document.getElementById('mod-pilates').checked, tienda: document.getElementById('mod-tienda').checked, asistencia: document.getElementById('mod-asistencia').checked, evaluaciones: document.getElementById('mod-evaluaciones').checked } 
            };
            
            try {
                if (editId) { await updateDoc(doc(db, "gimnasios", editId), gymData); showToast('Instancia actualizada'); } 
                else { gymData.estado = 'activo'; await addDoc(collection(db, "gimnasios"), gymData); showToast('Instancia desplegada'); }
                document.getElementById('btn-cancelar-edicion').click(); cargarGimnasios();
            } catch (error) { showToast("Error de base de datos", 'error'); } finally { btn.disabled = false; }
        });
        
        document.getElementById('btn-cancelar-edicion').addEventListener('click', () => { 
            document.getElementById('form-gym').reset(); document.getElementById('edit-gym-id').value = ""; 
            document.getElementById('form-title').innerHTML = `<span class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-sm">➕</span> Nuevo Cliente`; 
            document.getElementById('btn-submit').innerText = "Desplegar Instancia"; document.getElementById('btn-cancelar-edicion').classList.add('hidden'); 
        });

        cargarGimnasios();
    </script>
</body>
</html>
