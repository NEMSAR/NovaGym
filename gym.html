<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Sistema de Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; }
        .dynamic-bg { background-color: #3b82f6; } 
        .dynamic-text { color: #3b82f6; }
        .dynamic-border { border-color: #3b82f6; }
        .dynamic-btn { background-color: #3b82f6; }
        .dynamic-btn:hover { filter: brightness(1.1); }
        
        .glass-panel { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }
        .input-dark { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); color: white; }
        .input-dark:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        
        .nav-item { transition: all 0.2s ease-in-out; }
        .nav-item:hover { background: rgba(255,255,255,0.1); padding-left: 1.5rem; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Menú Lateral -->
    <aside id="sidebar" class="w-72 flex flex-col shadow-2xl z-20 border-r border-white/5 dynamic-bg relative overflow-hidden">
        <div class="absolute inset-0 bg-black/40 z-0 pointer-events-none"></div>
        
        <div class="p-8 text-center border-b border-white/10 z-10 relative">
            <h2 id="ui-gym-name" class="font-black text-2xl tracking-widest text-white drop-shadow-md">Cargando...</h2>
        </div>
        
        <nav id="ui-nav-menu" class="flex-1 p-4 space-y-2 mt-4 z-10 relative text-gray-200 font-medium">
            <a href="#" class="nav-item flex items-center gap-4 py-3 px-4 rounded-xl bg-white/10 text-white shadow-inner">
                <span>👥</span> Padrón de Socios
            </a>
            <a href="#" class="nav-item flex items-center gap-4 py-3 px-4 rounded-xl">
                <span>💳</span> Finanzas y Pagos
            </a>
            <a href="index.html" class="nav-item flex items-center gap-4 py-3 px-4 rounded-xl mt-10 text-red-300 hover:bg-red-500/20 hover:text-red-100">
                <span>🚪</span> Cerrar Sesión
            </a>
        </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 overflow-y-auto relative">
        <div class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] rounded-full blur-[120px] opacity-20 z-0 dynamic-bg"></div>
        
        <div class="p-10 relative z-10">
            <header class="flex justify-between items-end mb-12">
                <div>
                    <h1 class="text-4xl font-black text-white tracking-tight mb-2">Panel Operativo</h1>
                    <p class="text-gray-400">Resumen del sistema y alertas automáticas</p>
                </div>
                
                <div class="flex items-center gap-6">
                    <!-- Botón para abrir el Modal -->
                    <button id="btn-abrir-modal" class="dynamic-btn text-white font-bold py-3 px-6 rounded-xl shadow-lg transition flex items-center gap-2">
                        <span class="text-xl">+</span> Nuevo Socio
                    </button>

                    <div class="glass-panel px-6 py-3 rounded-2xl text-right">
                        <p class="text-xs text-gray-400 font-bold uppercase tracking-wider">Ingresos del Día</p>
                        <p class="text-xl font-bold dynamic-text">$45.000 ARS</p>
                    </div>
                </div>
            </header>

            <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
                <!-- Columna Principal -->
                <div class="xl:col-span-2 space-y-8">
                    <section class="glass-panel p-8 rounded-3xl">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-bold text-white flex items-center gap-3">
                                <span class="bg-orange-500/20 text-orange-400 p-2 rounded-xl">⚠️</span> 
                                Membresías Próximas a Vencer
                            </h2>
                            <span class="text-xs bg-gray-800 text-gray-400 px-3 py-1 rounded-full border border-gray-700">Seguimiento</span>
                        </div>
                        
                        <div id="loading-socios" class="text-center py-8 text-gray-500">
                            Analizando base de datos de socios...
                        </div>

                        <div id="contenedor-alertas" class="grid grid-cols-1 gap-4 hidden">
                            <!-- Alertas de Firebase irán aquí -->
                        </div>
                    </section>
                </div>
                
                <!-- Columna Secundaria -->
                <div class="space-y-6">
                    <div class="glass-panel p-6 rounded-3xl border-l-4 dynamic-border flex flex-col justify-center">
                        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">Total Socios</h3>
                        <p id="total-socios" class="text-4xl font-black text-white">0</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Alta de Socio -->
    <div id="modal-nuevo-socio" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/70 backdrop-blur-md transition-opacity">
        <div class="glass-panel p-8 rounded-3xl w-full max-w-md relative border border-white/10 shadow-2xl">
            <button id="btn-cerrar-modal" class="absolute top-5 right-5 text-gray-400 hover:text-white text-xl transition">✕</button>
            
            <h2 class="text-2xl font-bold text-white mb-6">Alta de Nuevo Socio</h2>
            
            <form id="form-socio" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Nombre Completo</label>
                    <input type="text" id="socio-nombre" class="w-full input-dark rounded-xl p-3" placeholder="Ej. Juan Pérez" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Teléfono (WhatsApp)</label>
                    <input type="tel" id="socio-telefono" class="w-full input-dark rounded-xl p-3" placeholder="Ej. 549112345678" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Tipo de Membresía</label>
                    <select id="socio-membresia" class="w-full input-dark rounded-xl p-3" required>
                        <option value="Pase Libre">Pase Libre</option>
                        <option value="Musculación">Musculación</option>
                        <!-- Las opciones extra se inyectarán según la config del gym -->
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Fecha de Vencimiento</label>
                    <input type="date" id="socio-vence" class="w-full input-dark rounded-xl p-3" required>
                </div>
                
                <button type="submit" id="btn-guardar-socio" class="w-full dynamic-btn text-white font-bold py-3 px-4 rounded-xl transition shadow-lg mt-4">
                    Registrar Socio
                </button>
            </form>
        </div>
    </div>

    <!-- Script Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZ2UaN7J_r7AVA9RCn945JrF2wMol-hh8",
            authDomain: "novagym-saas-enterprise.firebaseapp.com",
            projectId: "novagym-saas-enterprise",
            storageBucket: "novagym-saas-enterprise.firebasestorage.app",
            messagingSenderId: "578362101056",
            appId: "1:578362101056:web:d7833a58d16987acdb3ea5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ID fijo para esta demo (en el sistema real, este ID vendría del inicio de sesión)
        const GYM_ID = 'gym_001'; 
        let nombreGymActual = "";

        // Referencias del Modal
        const modal = document.getElementById('modal-nuevo-socio');
        const btnAbrirModal = document.getElementById('btn-abrir-modal');
        const btnCerrarModal = document.getElementById('btn-cerrar-modal');
        const formSocio = document.getElementById('form-socio');

        // Control del Modal
        btnAbrirModal.addEventListener('click', () => modal.classList.remove('hidden'));
        btnCerrarModal.addEventListener('click', () => modal.classList.add('hidden'));

        // Cargar datos de socios y repintar la UI
        async function cargarSocios() {
            const sociosRef = collection(db, "gimnasios", GYM_ID, "socios");
            const sociosSnap = await getDocs(sociosRef);
            
            const contenedorAlertas = document.getElementById('contenedor-alertas');
            const loader = document.getElementById('loading-socios');
            const totalSociosUi = document.getElementById('total-socios');
            
            loader.classList.add('hidden');
            contenedorAlertas.classList.remove('hidden');
            contenedorAlertas.innerHTML = ''; // Limpiar lista
            
            totalSociosUi.innerText = sociosSnap.size; // Actualizar contador

            if (sociosSnap.empty) {
                contenedorAlertas.innerHTML = `<p class="text-gray-400 text-center py-4 bg-gray-800/50 rounded-xl">No hay socios registrados.</p>`;
                return;
            }

            sociosSnap.forEach((docSnap) => {
                const socio = docSnap.data();
                
                const textoWs = `¡Hola ${socio.nombre}! Te escribimos de ${nombreGymActual}. Tu pase de ${socio.membresia || 'entrenamiento'} figura con vencimiento para el ${socio.vence}. ¡Te esperamos para renovar! 💪`;
                const linkWs = `https://wa.me/${socio.telefono}?text=${encodeURIComponent(textoWs)}`;

                const div = document.createElement('div');
                div.className = "flex justify-between items-center p-5 bg-gray-800/40 border border-gray-700/50 rounded-2xl hover:bg-gray-800/80 transition group";
                div.innerHTML = `
                    <div>
                        <p class="font-bold text-lg text-white mb-1">${socio.nombre}</p>
                        <p class="text-gray-400 text-sm flex items-center gap-2">
                            <span class="bg-gray-700 px-2 py-0.5 rounded text-xs text-gray-300">${socio.membresia}</span>
                            Vence: <span class="font-bold text-red-400">${socio.vence}</span>
                        </p>
                    </div>
                    <a href="${linkWs}" target="_blank" class="flex items-center gap-2 bg-[#25D366]/10 hover:bg-[#25D366] text-[#25D366] hover:text-white px-5 py-2.5 rounded-xl font-bold transition duration-300 border border-[#25D366]/30 hover:border-[#25D366] shadow-sm">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                        Notificar
                    </a>
                `;
                contenedorAlertas.appendChild(div);
            });
        }

        // Inicialización General
        async function inicializarDashboard() {
            try {
                const gymRef = doc(db, "gimnasios", GYM_ID);
                const gymSnap = await getDoc(gymRef);

                if (gymSnap.exists()) {
                    const gymData = gymSnap.data();
                    nombreGymActual = gymData.nombre;
                    
                    // Aplicar Configuración UI
                    document.getElementById('ui-gym-name').innerText = gymData.nombre.toUpperCase();
                    
                    if(gymData.colorPrimario) {
                        document.querySelectorAll('.dynamic-bg').forEach(el => el.style.backgroundColor = gymData.colorPrimario);
                        document.querySelectorAll('.dynamic-text').forEach(el => el.style.color = gymData.colorPrimario);
                        document.querySelectorAll('.dynamic-border').forEach(el => el.style.borderColor = gymData.colorPrimario);
                        document.querySelectorAll('.dynamic-btn').forEach(el => el.style.backgroundColor = gymData.colorPrimario);
                        
                        // Aplicar color al foco del formulario inyectando una regla CSS
                        const style = document.createElement('style');
                        style.innerHTML = `.input-dark:focus { border-color: ${gymData.colorPrimario}; box-shadow: 0 0 10px ${gymData.colorPrimario}40; }`;
                        document.head.appendChild(style);
                    }

                    // Inyectar opciones de membresía en el select dinámicamente
                    const selectMembresia = document.getElementById('socio-membresia');
                    if (gymData.modulos?.funcional) {
                        selectMembresia.insertAdjacentHTML('beforeend', `<option value="Funcional">Funcional</option>`);
                    }
                    if (gymData.modulos?.pilates) {
                        selectMembresia.insertAdjacentHTML('beforeend', `<option value="Pilates">Pilates</option>`);
                    }
                }

                // Cargar la lista de socios
                await cargarSocios();

            } catch (error) {
                console.error("Error inicializando:", error);
                document.getElementById('ui-gym-name').innerText = "Error de Conexión";
            }
        }

        // Evento para guardar un nuevo socio en Firebase
        formSocio.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSubmit = document.getElementById('btn-guardar-socio');
            btnSubmit.innerHTML = 'Guardando...';
            btnSubmit.disabled = true;

            const nuevoSocio = {
                nombre: document.getElementById('socio-nombre').value,
                telefono: document.getElementById('socio-telefono').value,
                membresia: document.getElementById('socio-membresia').value,
                vence: document.getElementById('socio-vence').value,
                estado: 'activo',
                fechaRegistro: new Date().toISOString()
            };

            try {
                // Guardar en la subcolección 'socios' del gimnasio correspondiente
                await addDoc(collection(db, "gimnasios", GYM_ID, "socios"), nuevoSocio);
                
                // Limpiar, cerrar modal y recargar lista en tiempo real
                formSocio.reset();
                modal.classList.add('hidden');
                await cargarSocios();
                
            } catch (error) {
                console.error("Error al registrar socio:", error);
                alert("Hubo un error de conexión al registrar el socio.");
            } finally {
                btnSubmit.innerHTML = 'Registrar Socio';
                btnSubmit.disabled = false;
            }
        });

        // Ejecutar al cargar la página
        inicializarDashboard();
    </script>
</body>
</html>
