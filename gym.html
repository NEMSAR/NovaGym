<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Gimnasio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <!-- Menú Lateral (El color se inyectará desde Firebase luego) -->
    <aside class="w-64 text-white flex flex-col shadow-lg" style="background-color: #ea580c;">
        <div class="p-6 text-center font-black text-2xl border-b border-white/20">
            FitCenter Plus
        </div>
        <nav class="flex-1 p-4 space-y-2 mt-4">
            <a href="#" class="flex items-center gap-3 py-3 px-4 rounded bg-white/20 font-bold">👥 Socios</a>
            <a href="#" class="flex items-center gap-3 py-3 px-4 rounded hover:bg-white/10 transition">🏋️ Funcional</a>
            <a href="#" class="flex items-center gap-3 py-3 px-4 rounded hover:bg-white/10 transition">🧘 Pilates</a>
            <a href="#" class="flex items-center gap-3 py-3 px-4 rounded hover:bg-white/10 transition">👆 Acceso Biométrico</a>
            <a href="index.html" class="flex items-center gap-3 py-3 px-4 rounded hover:bg-white/10 transition mt-auto">⬅ Salir</a>
        </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 p-8 overflow-y-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Panel de Control</h1>
        </header>

        <!-- Sección de Alertas -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                ⚠️ Membresías por Vencer
            </h2>
            <div id="contenedor-alertas" class="grid grid-cols-1 gap-4">
                <!-- Las alertas se cargarán por JS -->
            </div>
        </section>
    </main>

    <script>
        // Datos simulados de miembros por vencer
        const miembrosPorVencer = [
            { nombre: "Micaela Silva", membresia: "Pase Libre - Mensual", vence: "Hoy", telefono: "5491112345678" },
            { nombre: "Lean Gimenez", membresia: "Funcional 3 Días", vence: "Mañana", telefono: "5491112345679" }
        ];

        const contenedorAlertas = document.getElementById('contenedor-alertas');
        const nombreGym = "FitCenter Plus";

        // Renderizar lista y crear enlaces de WhatsApp
        miembrosPorVencer.forEach(socio => {
            const textoWs = `¡Hola ${socio.nombre}! Te escribimos de ${nombreGym}. Te recordamos que tu ${socio.membresia} vence ${socio.vence}. ¡Te esperamos para renovar! 💪`;
            const linkWs = `https://wa.me/${socio.telefono}?text=${encodeURIComponent(textoWs)}`;

            const div = document.createElement('div');
            div.className = "flex justify-between items-center p-4 border border-gray-100 rounded-lg hover:shadow-md transition";
            div.innerHTML = `
                <div>
                    <p class="font-bold text-lg text-gray-800">${socio.nombre}</p>
                    <p class="text-gray-500 text-sm">${socio.membresia} • Vence: <span class="font-bold text-red-500">${socio.vence}</span></p>
                </div>
                <a href="${linkWs}" target="_blank" class="flex items-center gap-2 bg-[#25D366] hover:bg-[#1DA851] text-white px-5 py-2.5 rounded-full font-bold transition shadow-sm">
                    💬 Avisar
                </a>
            `;
            contenedorAlertas.appendChild(div);
        });
    </script>

    <!-- Importamos Firebase como módulo al final del body -->
<script type="module">
    // 1. Importar las funciones de Firebase vía CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 2. Tu configuración (Reemplaza con los datos que te dio Firebase)
    const firebaseConfig = {
  apiKey: "AIzaSyCZ2UaN7J_r7AVA9RCn945JrF2wMol-hh8",
  authDomain: "novagym-saas-enterprise.firebaseapp.com",
  projectId: "novagym-saas-enterprise",
  storageBucket: "novagym-saas-enterprise.firebasestorage.app",
  messagingSenderId: "578362101056",
  appId: "1:578362101056:web:d7833a58d16987acdb3ea5"
};

    // 3. Inicializar Firebase y Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // Hacemos que la base de datos sea accesible globalmente en la ventana (para usarla en otros scripts si lo necesitas)
    window.db = db;
    window.collection = collection;
    window.addDoc = addDoc;
    window.getDocs = getDocs;

    console.log("🔥 Firebase conectado con éxito!");
</script>
</body>
</html>
